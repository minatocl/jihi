<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="自費会計">
<meta name="theme-color" content="#131518">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icon-180.png?v=2">
<link rel="icon" type="image/png" href="icon-180.png?v=2">
<link rel="manifest" href="manifest.webmanifest">
<title>自費会計</title>
<style>
:root{--pill-w:84px;--pill-h:164px;--fj:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Segoe UI","Yu Gothic UI","Noto Sans JP",Meiryo,sans-serif;--fn:var(--fj);--nw:700;--nls:0em;
  --bg:#131518;--panel:#1c1f23;--raise:#262a2f;--line:#31363c;--line2:#23272c;--text:#eef0f2;--sub:#a3aab3;--mute:#737b85;--acc:#6ab7f2;--acc-soft:rgba(106,183,242,.11);--acc-ink:#0b2338;--warn:#f2b757;--ng:#f0776b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 var(--fj);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
input{font:inherit;color:inherit;border-radius:0}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
[role=button]:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
h1,h2,p{margin:0}
.n{font-family:var(--fn);font-variant-numeric:tabular-nums;font-weight:var(--nw);letter-spacing:var(--nls)}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.w{display:inline-block}

.app{height:100vh;height:100dvh;display:flex;flex-direction:column}
.view{flex:1;min-height:0;display:flex;flex-direction:column}

/* ---------- 下のタブ（広い画面では左） ---------- */
.tabs{flex:none;display:grid;grid-template-columns:repeat(4,1fr);background:var(--bg);border-top:1px solid var(--line2);padding:4px 0 calc(6px + env(safe-area-inset-bottom))}
.tab{display:grid;justify-items:center;gap:1px;padding:7px 0 5px;color:var(--mute);font-size:11px}
.tab.on{color:var(--acc)}

/* ---------- 会計 ---------- */
/* 上の段（tz）。閉じたスマホの右上には、時刻と電波の表示（幅54・高さ137ほど）がかぶさる。
   その端末では html に pill が付き、上の段の右側を空けて、下の一覧はその表示より下から始める */
/* 列の幅は minmax(0,1fr) にする。auto のままだと、入力欄がもともと持っている最小の幅（20文字ぶん）に引っぱられて段全体が右へはみ出し、
   空けたはずの右上に入り込む（2026-11-21、院長の実機の Safari で会計の画面だけ重なった原因） */
.tz{flex:none;display:grid;grid-template-columns:minmax(0,1fr);gap:8px;align-content:start;padding:calc(10px + env(safe-area-inset-top)) 16px 8px}
.pill .tz{padding-right:calc(16px + var(--pill-w));min-height:var(--pill-h)}
.top{display:flex;align-items:center;gap:8px}
.top h1{display:none;font-size:22px;font-weight:700;letter-spacing:.04em}
.kid{flex:1;min-width:0;display:flex;align-items:center;gap:10px;height:48px;padding:0 14px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.kid:focus-within{border-color:var(--acc)}
.kid span{flex:none;font-size:12px;color:var(--sub)}
.kid input{flex:1;width:0;min-width:0;height:100%;background:none;border:0;outline:0;font-family:var(--fn);font-weight:var(--nw);font-size:21px;letter-spacing:.05em}
.kid input::placeholder{font:400 14px var(--fj);letter-spacing:0;color:var(--mute)}
.search{display:flex;align-items:center;gap:8px;height:44px;padding:0 12px;border-radius:12px;background:var(--panel);border:1px solid var(--line2);color:var(--mute)}
.search:focus-within{border-color:var(--acc)}
.search svg{width:18px;height:18px}
.search input{flex:1;width:0;min-width:0;height:100%;background:none;border:0;outline:0;font-size:16px;color:var(--text);-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--mute);font-size:14px}
.search input::-webkit-search-cancel-button{-webkit-appearance:none}
.search .clr{flex:none;width:28px;height:28px;border-radius:14px;background:var(--raise);color:var(--sub);display:grid;place-items:center;position:relative}
.search .clr svg{width:14px;height:14px}
.search .clr::after{content:"";position:absolute;top:-8px;right:-8px;bottom:-8px;left:-8px}
.search.wide{display:none}
.textbtn{flex:none;height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line);color:var(--sub);font-size:13px}
.cats{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats:empty{display:none}
.chip{flex:none;height:36px;padding:0 14px;border-radius:18px;background:var(--panel);border:1px solid var(--line);color:var(--sub);font-size:13px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--text);border-color:var(--text);color:var(--bg)}
.info{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:2px 12px;min-height:36px;font-size:12px;color:var(--sub);white-space:nowrap}
.info b{font-size:15px;color:var(--text);margin:0 2px 0 5px}
/* 品目のタイル。幅が430ほどあれば横3列、それより狭いスマホでは2列 */
.grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(124px,1fr));grid-auto-rows:max-content;gap:8px;padding:8px 16px 14px;overflow-y:auto;align-content:start;-webkit-overflow-scrolling:touch}
.tile{position:relative;padding:9px 10px 8px;border-radius:12px;background:var(--panel);border:1px solid var(--line2);display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto;align-content:space-between;gap:4px 6px;cursor:pointer;transition:transform .08s;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.tile:active{transform:scale(.97)}
.tile .nm{grid-column:1/3;font-size:13.5px;font-weight:600;line-height:1.3;min-height:2.6em;overflow-wrap:anywhere;padding-right:12px}
.tile .nm small{font:400 10px var(--fj);color:var(--mute);margin-left:4px;white-space:nowrap}
.tile .q{position:absolute;top:-7px;right:-5px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:var(--acc);color:var(--acc-ink);box-shadow:0 0 0 2.5px var(--bg);display:none;place-items:center;font-size:15px;line-height:1}
.tile .pr{grid-column:2;grid-row:2;justify-self:end;align-self:end;font-size:16px;line-height:1.1}
.tile .minus{grid-column:1;grid-row:2;justify-self:start;align-self:end;width:26px;height:26px;border-radius:13px;border:1px solid rgba(106,183,242,.45);color:var(--acc);display:grid;visibility:hidden;place-items:center;font-size:15px;line-height:1;position:relative}
.tile .minus::after{content:"";position:absolute;top:-8px;right:-8px;bottom:-8px;left:-8px}
.tile.on{border-color:var(--acc);background:linear-gradient(var(--acc-soft),var(--acc-soft)),var(--panel)}
.tile.on .q{display:grid}
.tile.on .minus{visibility:visible}
.blank{grid-column:1/-1;color:var(--mute);font-size:13px;text-align:center;padding:36px 8px;line-height:1.9}
.blank button{display:inline-block;margin-top:10px;height:40px;padding:0 16px;border-radius:12px;border:1px solid var(--line);color:var(--text);font-size:14px}

/* 下の帯は1段（左に点数と合計、右にボタン）。背の低い画面でも品目が多く見えるように */
.bar{flex:none;display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;background:var(--raise);border-top:1px solid var(--line);padding:8px 16px 10px}
.sum{display:grid;gap:1px;text-align:left;min-width:0}
.sum .cnt{color:var(--sub);font-size:12px;display:flex;align-items:baseline;gap:2px;white-space:nowrap}
.sum .cnt b{font-size:15px;color:var(--text);margin-right:1px}
.sum .cnt i{font-style:normal;color:var(--acc);margin-left:8px;display:inline-flex;align-items:center;gap:2px}
.sum .cnt i svg{width:14px;height:14px;transform:rotate(180deg) translateY(-2px)}
.sum .tot{font-size:28px;line-height:1.1}
.bar .go{width:auto;min-width:156px;height:52px;padding:0 20px}
.go{width:100%;height:54px;border-radius:14px;background:var(--acc);color:var(--acc-ink);font-size:16px;font-weight:700;letter-spacing:.05em}
.go:disabled{opacity:.3}

.scrim{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
.pane{position:fixed;left:0;right:0;bottom:0;max-height:88vh;max-height:88dvh;transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1),visibility 0s .25s;background:var(--panel);border-radius:20px 20px 0 0;border-top:1px solid var(--line);padding:6px 16px calc(16px + env(safe-area-inset-bottom));z-index:20;display:flex;flex-direction:column;visibility:hidden}
body.sheet .pane{transform:none;visibility:visible;transition:transform .25s cubic-bezier(.2,.8,.2,1),visibility 0s}
body.sheet .scrim{opacity:1;pointer-events:auto}
.pane.kb{top:env(safe-area-inset-top);bottom:auto;max-height:54vh;max-height:54dvh;border-radius:0 0 20px 20px;border-top:0;border-bottom:1px solid var(--line)}
.pill .pane{max-height:calc(100vh - var(--pill-h) - 6px);max-height:calc(100dvh - var(--pill-h) - 6px)}
.pill .pane.kb{top:0;max-height:54vh;max-height:54dvh;padding-right:calc(16px + var(--pill-w))}
.ph{flex:none;display:flex;align-items:center;gap:12px;padding:10px 0 8px}
.ph h2{font-size:17px;font-weight:700;flex:1}
.ph .no{font-size:12px;color:var(--mute)}
.ph .no b{font-size:14px;color:var(--sub);margin-left:3px}
.ph .x{height:36px}
.pscroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.kid.inpane{margin:2px 0 6px}
.lines{list-style:none;margin:0;padding:0}
.lines li{display:grid;grid-template-columns:1fr auto 78px;align-items:center;gap:10px;min-height:52px;border-bottom:1px solid var(--line2)}
.lines .nm{font-size:14px;line-height:1.35;overflow-wrap:anywhere}
.stp{display:flex;align-items:center}
.stp button{width:32px;height:32px;border-radius:16px;border:1px solid var(--line);color:var(--sub);font-size:17px;line-height:1;position:relative}
.stp button::after{content:"";position:absolute;top:-6px;right:-6px;bottom:-6px;left:-6px}
.stp b{width:28px;text-align:center;font-size:17px}
.lines .am{text-align:right;font-size:17px}
.lines .empty{display:block;border:0;color:var(--mute);font-size:13px;padding:28px 0;text-align:center;min-height:0}
.taxrow{display:flex;justify-content:space-between;color:var(--mute);font-size:12px;padding:10px 0 0}
.taxrow + .taxrow{padding-top:2px}
.total{display:flex;justify-content:space-between;align-items:baseline;padding:2px 0 12px}
.total span{font-size:13px;color:var(--sub)}
.total b{font-size:44px;line-height:1.1}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;min-height:48px;border-top:1px solid var(--line2);color:var(--sub);font-size:13px;text-align:left}
.opt .cur{display:inline-flex;align-items:center;gap:4px;color:var(--mute);font-size:12px;min-width:0}
.opt .cur em{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px}
.opt svg{width:16px;height:16px;transition:transform .15s}
.opt[aria-expanded=true] svg{transform:rotate(180deg)}
.optbody{padding:2px 0 10px;display:grid;gap:10px}
.fld{display:grid;gap:5px}
.fld span{font-size:12px;color:var(--sub)}
.fld input{height:46px;padding:0 12px;border-radius:12px;background:var(--bg);border:1px solid var(--line);outline:0;font-size:16px;width:100%}
.fld input:focus{border-color:var(--acc)}
.sw{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:46px;width:100%;text-align:left;font-size:13px;color:var(--sub)}
.sw small{display:block;font-size:11px;color:var(--mute);margin-top:2px}
.sw i{flex:none;width:46px;height:28px;border-radius:14px;background:var(--raise);border:1px solid var(--line);position:relative;transition:background .15s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--sub);transition:transform .15s,background .15s}
.sw[aria-checked=true] i{background:var(--acc);border-color:var(--acc)}
.sw[aria-checked=true] i::after{transform:translateX(18px);background:var(--acc-ink)}
.pane .go{margin-top:10px;flex:none}

/* ---------- 履歴・月次・設定に共通 ---------- */
.vh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;min-height:32px}
.vh h1{font-size:20px;font-weight:700;letter-spacing:.04em}
.vscroll{flex:1;min-height:0;overflow-y:auto;padding:4px 16px 24px;-webkit-overflow-scrolling:touch}
.card{background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:14px}
.card h2{font-size:13px;font-weight:600;color:var(--sub);margin-bottom:10px}
.btn{height:46px;padding:0 16px;border-radius:12px;border:1px solid var(--line);font-size:14px;font-weight:600;white-space:nowrap}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.dng{background:var(--ng);border-color:var(--ng);color:#2a0d09}
.btn.dngtext{color:var(--ng);border-color:transparent;padding:0 6px}
.btn:disabled{opacity:.35}
.btn.full{width:100%}
label.btn{display:grid;place-items:center;cursor:pointer}
.vhid{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}

/* 履歴 */
.today{font-size:12px;color:var(--sub);min-height:26px;white-space:nowrap}
.today b{font-size:19px;color:var(--text);margin:0 2px 0 6px}
.day{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-weight:600;color:var(--sub);margin:18px 2px 8px}
.day span{font-size:12px;font-weight:400;color:var(--mute)}
.day span b{color:var(--sub);font-size:14px;margin-left:6px}
.sale{background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.sale .r1{display:flex;align-items:baseline;gap:10px}
.sale .no{font-size:13px;color:var(--sub)}
.sale .tm{font-size:13px;color:var(--mute)}
.sale .amt{margin-left:auto;font-size:21px}
.sale .tag{font-size:11px;color:var(--ng);border:1px solid var(--ng);border-radius:6px;padding:0 6px;line-height:18px}
.sale .r2{margin-top:6px;font-size:13px;line-height:1.6;color:var(--sub);overflow-wrap:anywhere}
.sale .idc{display:inline-block;font-size:13px;color:var(--acc);background:var(--acc-soft);border-radius:6px;padding:0 7px;margin-right:8px;line-height:22px}
.sale .idc.none{color:var(--mute);background:var(--raise);font:400 11px/22px var(--fj);letter-spacing:0}
.sale .memo{margin-top:4px;font-size:12px;color:var(--mute);overflow-wrap:anywhere}
.sale .acts{display:flex;gap:8px;margin-top:10px}
.sale .acts button{flex:1;height:40px;border-radius:10px;border:1px solid var(--line);font-size:13px;color:var(--sub)}
.sale .acts button:first-child{color:var(--text)}
.sale.void .amt{text-decoration:line-through;color:var(--mute)}
.sale.void .r2{opacity:.55}
.more{display:block;margin:6px auto 0}

/* 月次 */
.months{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.months::-webkit-scrollbar{display:none}
.mbody{display:grid;gap:12px}
.msum .lab{font-size:12px;color:var(--sub)}
.msum .big{font-size:44px;line-height:1.15;margin-top:2px}
.msum .cnt{font-size:12px;color:var(--sub)}
.msum .cnt b{font-size:16px;color:var(--text);margin-right:2px}
.brow{padding:8px 0;border-top:1px solid var(--line2)}
.brow:first-of-type{border-top:0}
.brow .l{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:14px}
.brow .l span{overflow-wrap:anywhere}
.brow .l small{font-size:12px;color:var(--mute);margin-left:6px}
.brow .l b{flex:none;font-size:17px}
.brow .bg{height:4px;border-radius:2px;background:var(--raise);margin-top:6px;overflow:hidden}
.brow .bg i{display:block;height:100%;border-radius:2px;background:var(--acc)}
.none{color:var(--mute);font-size:13px;padding:8px 0}

/* 設定 */
.sgrid{display:grid;gap:12px}
.scol{display:grid;gap:12px;align-content:start}
.card .fld + .fld{margin-top:10px}
.logo{display:flex;align-items:center;gap:10px;margin-top:12px}
.logo img{height:40px;border-radius:6px;background:#fff}
.logo label{flex:1;height:46px;display:grid;place-items:center;border-radius:12px;border:1px solid var(--line);font-size:14px;font-weight:600;cursor:pointer}
.mrow{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;border-top:1px solid var(--line2);min-height:58px}
.mrow:first-child{border-top:0}
.ord{display:flex;gap:4px}
.ord button{width:34px;height:40px;border-radius:9px;border:1px solid var(--line);color:var(--sub);display:grid;place-items:center}
.ord button svg{width:16px;height:16px}
.ord button:disabled{opacity:.25}
.mmain{display:grid;text-align:left;padding:8px 4px;min-width:0}
.mmain .mn{font-size:14px;font-weight:600;overflow-wrap:anywhere}
.mmain .mm{font-size:11px;color:var(--mute)}
.mrow > b{font-size:17px;padding-right:2px}
.mlist + .btn{margin-top:12px}
.hint{font-size:12px;color:var(--mute);line-height:1.7}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.ver{font-size:11px;color:var(--mute);text-align:center;padding:6px 0}

/* ---------- 小窓・お知らせ ---------- */
.dlgwrap{position:fixed;top:0;right:0;bottom:0;left:0;z-index:50;background:rgba(0,0,0,.6);display:grid;justify-items:center;align-items:start;padding:calc(9vh + env(safe-area-inset-top)) 16px 16px;overflow-y:auto}
.pill .dlgwrap{padding-top:calc(var(--pill-h) + 6px)}
.dlgwrap.kb{padding-top:10px}
.pill .dlgwrap.kb{padding-top:10px;padding-right:calc(16px + var(--pill-w))}
.dlg{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px}
.dlg h2{font-size:17px;font-weight:700;line-height:1.5}
.dlg p{font-size:13px;color:var(--sub);margin-top:6px;line-height:1.7}
.dlg .fld{margin-top:12px}
.dacts{display:flex;gap:8px;margin-top:18px;align-items:center}
.dacts .sp{flex:1}
.dacts .btn{flex:1}
.dacts .btn.dngtext{flex:none}
.done{text-align:center}
.done .okmark{width:52px;height:52px;border-radius:50%;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center;margin:2px auto 10px}
.done .okmark svg{width:28px;height:28px;stroke-width:2.2}
.done .meta{font-size:13px}
.done .meta b{font-size:16px;color:var(--text);margin:0 2px}
.done .big{font-size:42px;color:var(--text);line-height:1.2;margin-top:4px}
.done .state{min-height:1.7em}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-top:12px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg2 button{height:44px;font-size:14px;color:var(--sub)}
.seg2 button.on{background:var(--text);color:var(--bg);font-weight:600}
.catpick{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip.sm{height:32px;padding:0 12px;font-size:12px}
.err{color:var(--ng)!important}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translate(-50%,10px);background:var(--text);color:var(--bg);font-size:13px;font-weight:600;padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:86vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
#receipt-print{display:none}

/* ---------- 広い画面（開いたスマホ・iPad・PC） ---------- */
@media (min-width:700px){
  .app{display:grid;grid-template-columns:calc(76px + env(safe-area-inset-left)) 1fr;grid-template-rows:1fr}
  .tabs{grid-column:1;grid-row:1;grid-template-columns:none;align-content:start;gap:6px;padding:18px 8px 18px calc(8px + env(safe-area-inset-left));border-top:0;border-right:1px solid var(--line2)}
  .tab{padding:10px 0 8px;border-radius:12px}
  .tab.on{background:var(--acc-soft)}
  .view{grid-column:2;grid-row:1}
  .v-register{display:grid;grid-template-columns:1fr 352px;grid-template-rows:auto 1fr}
  .tz{padding:calc(20px + env(safe-area-inset-top)) 28px 10px}
  .v-register .tz{grid-column:1;grid-row:1;padding:calc(18px + env(safe-area-inset-top)) 24px 6px}
  .top{justify-content:space-between}
  .top h1{display:block}
  .top .kid,.search.narrow,.info{display:none!important}
  .search.wide{display:flex;width:240px}
  .grid{grid-column:1;grid-row:2;grid-template-columns:repeat(3,1fr);gap:12px;padding:10px 24px 24px}
  .tile{padding:11px 12px 10px;border-radius:14px;gap:6px 8px}
  .tile .nm{font-size:15px;padding-right:16px}
  .tile .q{top:-8px;right:-6px;min-width:28px;height:28px;padding:0 8px;border-radius:14px;font-size:17px;box-shadow:0 0 0 3px var(--bg)}
  .tile .pr{font-size:19px}
  .tile .minus{width:30px;height:30px;border-radius:15px;font-size:17px}
  .bar,.scrim,.ph .x{display:none}
  .pane,.pane.kb{position:static;transform:none;visibility:visible;grid-column:2;grid-row:1/3;max-height:none;border-radius:0;border-top:0;border-bottom:0;border-left:1px solid var(--line2);padding:calc(12px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right)) 20px 20px}
  .total b{font-size:48px}
  .vh h1{font-size:22px}
  .vscroll{padding:4px 28px 28px}
  .search.block{max-width:420px}
  .tz > .btn{max-width:320px}
  .tz > .hint{max-width:520px}
  .hlist{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;align-items:start}
  .day,.more,.hlist .none{grid-column:1/-1}
  .mbody{grid-template-columns:minmax(260px,1fr) 1.4fr;align-items:start}
  .sgrid{grid-template-columns:1.15fr 1fr;align-items:start}
  .ver{grid-column:1/-1}
  .dlgwrap{padding-top:12vh}
  .toast{bottom:40px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  html,body{height:auto!important;overflow:visible!important;background:#fff!important}
  body > *{display:none!important}
  #receipt-print{display:block!important;position:absolute;left:0;top:0;width:148mm;height:208mm;padding:10mm;box-sizing:border-box;overflow:hidden;background:#fff}
  @page{size:A5 portrait;margin:0}
}
</style>
</head>
<body>
<div class="app">
  <!-- ============ 会計 ============ -->
  <section class="view v-register" data-view="register">
    <header class="tz">
      <div class="top">
        <h1>会計</h1>
        <label class="kid"><span>カルテID</span><input data-bind="karteId" inputmode="numeric" autocomplete="off" autocapitalize="off" autocorrect="off" enterkeyhint="done" placeholder="番号を入れる"></label>
        <label class="search wide"><input data-bind="q" type="search" placeholder="メニューを探す" autocomplete="off" enterkeyhint="search"></label>
      </div>
      <label class="search narrow"><input data-bind="q" type="search" placeholder="メニューを探す" autocomplete="off" enterkeyhint="search"><button type="button" class="clr" data-act="clear-q" aria-label="探す字を消す" hidden></button></label>
      <nav class="cats" aria-label="分類"></nav>
      <div class="info" hidden></div>
    </header>
    <main class="grid"></main>
    <section class="bar">
      <button class="sum" data-act="open-sheet"><span class="cnt"></span><span class="tot n"></span></button>
      <button class="go" data-act="open-sheet">会計に進む</button>
    </section>
    <div class="scrim" data-act="close-sheet"></div>
    <aside class="pane" aria-label="お会計">
      <div class="ph"><h2>お会計</h2><span class="no">領収書 No.<b class="n"></b></span><button class="textbtn x" data-act="close-sheet">閉じる</button></div>
      <div class="pscroll">
        <label class="kid inpane"><span>カルテID</span><input data-bind="karteId" inputmode="numeric" autocomplete="off" autocapitalize="off" autocorrect="off" enterkeyhint="done" placeholder="番号を入れる"></label>
        <ul class="lines"></ul>
        <div class="sums"></div>
        <button class="opt" data-act="toggle-opt" aria-expanded="false"><span>但し書き・メモ・内訳の印字</span><span class="cur"></span></button>
        <div class="optbody" hidden>
          <label class="fld"><span>但し書き</span><input data-bind="proviso" autocomplete="off" enterkeyhint="done"></label>
          <label class="fld"><span>メモ（アプリの中だけに残ります。印字されません）</span><input data-bind="memo" autocomplete="off" enterkeyhint="done"></label>
          <button class="sw" data-act="toggle-print-items" role="switch" aria-checked="false"><span>内訳（メニュー名）を領収書に印字する</span><i></i></button>
        </div>
      </div>
      <button class="go issue" data-act="issue">領収書を発行する</button>
    </aside>
  </section>

  <!-- ============ 履歴 ============ -->
  <section class="view v-history" data-view="history" hidden>
    <header class="tz">
      <div class="vh"><h1>履歴</h1></div>
      <div class="today"></div>
      <label class="search block"><input data-bind="histQ" type="search" placeholder="カルテID・メモ・領収書番号で探す" autocomplete="off" enterkeyhint="search"></label>
    </header>
    <div class="vscroll"><div class="hlist"></div></div>
  </section>

  <!-- ============ 月次 ============ -->
  <section class="view v-monthly" data-view="monthly" hidden>
    <header class="tz">
      <div class="vh"><h1>月次</h1></div>
      <nav class="months" aria-label="月"></nav>
      <button class="btn" data-act="csv">この月をCSVで書き出す</button>
    </header>
    <div class="vscroll"><div class="mbody"></div></div>
  </section>

  <!-- ============ 設定 ============ -->
  <section class="view v-settings" data-view="settings" hidden>
    <header class="tz">
      <div class="vh"><h1>設定</h1></div>
      <p class="hint">メニューは、押すと直せます。売上と設定の控えは、下の「バックアップ」から取れます。</p>
    </header>
    <div class="vscroll">
      <div class="sgrid">
        <div class="scol">
          <section class="card">
            <h2>メニュー（金額は税込。押すと直せます）</h2>
            <div class="mlist"></div>
            <button class="btn full" data-act="menu-new">メニューを追加</button>
          </section>
        </div>
        <div class="scol">
          <section class="card">
            <h2>クリニック情報（領収書に印字されます）</h2>
            <label class="fld"><span>クリニック名</span><input data-cfg="clinicName" autocomplete="off"></label>
            <label class="fld"><span>住所</span><input data-cfg="address" autocomplete="off"></label>
            <label class="fld"><span>電話番号</span><input data-cfg="tel" inputmode="tel" autocomplete="off"></label>
            <label class="fld"><span>インボイス登録番号（T＋13桁）</span><input data-cfg="invoiceNo" autocomplete="off" autocapitalize="characters"></label>
            <div class="logo"></div>
            <input type="file" id="logofile" accept="image/*" class="vhid" tabindex="-1">
          </section>
          <section class="card">
            <h2>領収書番号</h2>
            <label class="fld"><span>次に発行する番号</span><input data-cfg="receiptCounter" inputmode="numeric" autocomplete="off"></label>
          </section>
          <section class="card">
            <h2>バックアップ</h2>
            <p class="hint">売上と設定を1つのファイルにまとめて書き出します。スマホを替えるときは、前のスマホで書き出し、新しいスマホで読み込みます。読み込んでも、いまある売上は消えません。</p>
            <div class="two"><button class="btn" data-act="backup-export">書き出す</button><label class="btn" for="bkfile">読み込む</label></div>
            <input type="file" id="bkfile" accept="application/json,.json,text/plain" class="vhid" tabindex="-1">
          </section>
          <section class="card">
            <h2>画面</h2>
            <button class="sw pillsw" data-act="toggle-pill" role="switch" aria-checked="false"><span>右上の時刻・電波の表示をよける<small>閉じたスマホで、右上の表示と重なるときにオンにします</small></span><i></i></button>
          </section>
        </div>
        <p class="ver"></p>
      </div>
    </div>
  </section>

  <nav class="tabs" aria-label="画面の切り替え"></nav>
</div>
<div class="dlgwrap" hidden><div class="dlg" role="dialog" aria-modal="true"></div></div>
<div class="toast" role="status" aria-live="polite"></div>
<div id="receipt-print"></div>

<script>
"use strict";
/* 自費会計 —— 売上と設定は、この端末の中（localStorage の jihi-config / jihi-sales）にだけ保存する。
   保存の鍵名とデータの形は、2026年7月の最初の版から変えていない（前の版で入れた売上がそのまま読める）。 */
var VERSION = "2026-11-21b";
var K_CFG = "jihi-config", K_SALES = "jihi-sales";
var DEFAULT_PROVISO = "自由診療として";
var HIST_PAGE = 100;
var DEFAULT_CONFIG = {
  clinicName: "みなとクリニック",
  address: "神奈川県横浜市",
  tel: "045-000-0000",
  invoiceNo: "T0000000000000",
  logo: null,
  receiptCounter: 1,
  menus: [
    { id: "m1", name: "インフルエンザワクチン", price: 3500, taxRate: 10 },
    { id: "m2", name: "診断書", price: 3300, taxRate: 10 },
    { id: "m3", name: "プラセンタ注射", price: 2200, taxRate: 10 }
  ]
};

/* ---------- 小道具 ---------- */
function $(s, r) { return (r || document).querySelector(s); }
function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function yen(n) { return "¥" + (Number(n) || 0).toLocaleString("ja-JP"); }
function num(n) { return (Number(n) || 0).toLocaleString("ja-JP"); }
function pad2(x) { return String(x).padStart(2, "0"); }
function pad5(n) { return String(n == null ? "" : n).padStart(5, "0"); }
function fmtDate(iso) { var d = new Date(iso); return d.getFullYear() + "年" + (d.getMonth() + 1) + "月" + d.getDate() + "日"; }
function fmtDateTime(iso) { var d = new Date(iso); return (d.getMonth() + 1) + "/" + d.getDate() + " " + pad2(d.getHours()) + ":" + pad2(d.getMinutes()); }
function fmtTime(iso) { var d = new Date(iso); return pad2(d.getHours()) + ":" + pad2(d.getMinutes()); }
function monthKey(iso) { var d = new Date(iso); return d.getFullYear() + "-" + pad2(d.getMonth() + 1); }
function dayKey(iso) { var d = new Date(iso); return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
var WD = ["日", "月", "火", "水", "木", "金", "土"];
function dayLabel(iso) { var d = new Date(iso); return (d.getMonth() + 1) + "月" + d.getDate() + "日（" + WD[d.getDay()] + "）"; }
/* ひらがなでもカタカナでも探せるようにそろえる */
function kana(s) { return String(s).toLowerCase().replace(/[ぁ-ゖ]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) + 0x60); }); }
/* 品目名を読みやすい位置で折り返す（漢字とカタカナの切れ目、よくある語尾の前） */
var TAILS = ["ワクチン", "注射", "点滴", "診断書", "証明書", "セット", "クリーム", "検査", "止め"];
function kind(ch) { var c = ch.charCodeAt(0); if (c >= 0x4E00 && c <= 0x9FFF) return "K"; if ((c >= 0x30A0 && c <= 0x30FF) || (c >= 0x41 && c <= 0x5A) || (c >= 0x61 && c <= 0x7A) || (c >= 0x30 && c <= 0x39)) return "T"; return "O"; }
function seg(name) {
  var s = String(name), parts = [], cur = "", prev = "";
  for (var i = 0; i < s.length; i++) {
    var k = kind(s[i]);
    if (cur && ((prev === "K" && k === "T") || (prev === "T" && k === "K" && kind(s[i - 1]) === "T" && s.charCodeAt(i - 1) >= 0x30A0))) { parts.push(cur); cur = ""; }
    cur += s[i]; prev = k;
  }
  if (cur) parts.push(cur);
  var out = [];
  parts.forEach(function (w) {
    var t = null;
    for (var j = 0; j < TAILS.length; j++) { if (w.length > TAILS[j].length && w.slice(-TAILS[j].length) === TAILS[j]) { t = TAILS[j]; break; } }
    if (t) { out.push(w.slice(0, -t.length)); out.push(t); } else out.push(w);
  });
  return out.map(function (w) { return '<span class="w">' + esc(w) + "</span>"; }).join("");
}
var I = {
  pay: '<svg viewBox="0 0 24 24"><path d="M5 2.5v19l2.3-1.2 2.4 1.2 2.3-1.2 2.3 1.2 2.4-1.2 2.3 1.2v-19l-2.3 1.2-2.4-1.2L12 3.7 9.7 2.5 7.3 3.7Z"/><path d="m9.3 7.6 2.7 3.5 2.7-3.5M12 11.1v5.6M9.6 12.6h4.8M9.6 15h4.8"/></svg>',
  hist: '<svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 2.7-6.4L3 8"/><path d="M3 3v5h5M12 7.5V12l3.5 2"/></svg>',
  month: '<svg viewBox="0 0 24 24"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M8 17v-3M13 17V6M18 17V10"/></svg>',
  conf: '<svg viewBox="0 0 24 24"><path d="M21 5h-7M10 5H3M21 12h-9M8 12H3M21 19h-5M12 19H3M14 3v4M8 10v4M16 17v4"/></svg>',
  search: '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7.5"/><path d="m20.5 20.5-4.2-4.2"/></svg>',
  chev: '<svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>',
  up: '<svg viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></svg>',
  check: '<svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>',
  x: '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>'
};

/* ---------- 保存と読み込み ---------- */
var loadTrouble = [];   /* 読めなかった鍵。1つでもあれば、上書きで失わないよう、この回は何も保存しない */
var STOP_TITLE = "記録を止めています";
var STOP_BODY = "保存してあった内容の一部を読めませんでした。上書きで失わないよう、新しい記録を止めています。読めなかった分は消さずに残してあります。この画面のまま、Claude に知らせてください。";
function trouble(key, raw) {
  /* 読めない中身の控えを1つだけ残す（開き直すたびに増やさない） */
  try { if (raw != null && localStorage.getItem(key + ".broken") == null) localStorage.setItem(key + ".broken", raw); } catch (e) {}
  if (loadTrouble.indexOf(key) < 0) loadTrouble.push(key);
}
function loadKey(key, fallback, okType) {
  var raw = null, v;
  try { raw = localStorage.getItem(key); } catch (e) { return fallback; }
  if (raw == null || raw === "") return fallback;
  try { v = JSON.parse(raw); } catch (e) { trouble(key, raw); return fallback; }
  if (!okType(v)) { trouble(key, raw); return fallback; }
  return v;
}
function saveKey(key, value) {
  if (loadTrouble.length) { notice(STOP_TITLE, STOP_BODY); return false; }
  try { localStorage.setItem(key, JSON.stringify(value)); return true; }
  catch (e) {
    console.error("storage error", e);
    notice("保存できませんでした", "端末の空きを確かめてください。いまの操作は記録されていません。");
    return false;
  }
}
var config = DEFAULT_CONFIG, sales = [];
function maxReceiptNo(list) { var mx = 0; (list || sales).forEach(function (x) { var n = parseInt(x.receiptNo, 10); if (n > mx) mx = n; }); return mx; }
function load() {
  var cfg = loadKey(K_CFG, null, function (v) { return !!v && typeof v === "object" && !Array.isArray(v); });
  var s = loadKey(K_SALES, [], Array.isArray);
  config = Object.assign({}, DEFAULT_CONFIG, cfg || {});
  if (!Array.isArray(config.menus)) config.menus = DEFAULT_CONFIG.menus.slice();
  config.menus = config.menus.filter(function (m) { return m && m.id != null && m.name != null; });
  var rc = parseInt(config.receiptCounter, 10); config.receiptCounter = rc > 0 ? rc : 1;
  sales = s.filter(function (x) { return x && x.id != null; });
  /* 設定の鍵だけが無く売上はあるとき、番号を1からにせず続きから始める */
  if (!cfg && sales.length) config.receiptCounter = Math.max(config.receiptCounter, maxReceiptNo() + 1);
}
function persistConfig(next) { if (!saveKey(K_CFG, next)) return false; config = next; return true; }
function persistSales(next) { if (!saveKey(K_SALES, next)) return false; sales = next; return true; }

/* ---------- いまの状態 ---------- */
var st = { view: "register", cart: [], karteId: "", memo: "", proviso: DEFAULT_PROVISO, printItems: false, cat: "すべて", q: "", optOpen: false, histQ: "", histLimit: HIST_PAGE, selMonth: null };

function cats() {
  var names = [], other = false;
  config.menus.forEach(function (m) { var c = String(m.cat || "").trim(); if (c) { if (names.indexOf(c) < 0) names.push(c); } else other = true; });
  names = names.filter(function (c) { return c !== "すべて"; });
  if (!names.length) return [];
  return ["すべて"].concat(names, (other && names.indexOf("その他") < 0) ? ["その他"] : []);
}
function itemsOf(s) { return Array.isArray(s.items) ? s.items : []; }
function totals(cart) {
  var total = 0, taxable = 0;
  cart.forEach(function (x) { var a = (Number(x.price) || 0) * (Number(x.qty) || 0); total += a; if (x.taxRate === 10) taxable += a; });
  return { total: total, taxable: taxable, exempt: total - taxable, taxIncluded: Math.floor((taxable * 10) / 110), count: cart.reduce(function (a, x) { return a + x.qty; }, 0) };
}
function qtyOf(id) { for (var i = 0; i < st.cart.length; i++) if (st.cart[i].menuId === id) return st.cart[i].qty; return 0; }
function addToCart(id) {
  var m = null; config.menus.forEach(function (x) { if (String(x.id) === String(id)) m = x; });
  if (!m) return;
  var hit = false;
  st.cart = st.cart.map(function (x) { if (x.menuId === m.id) { hit = true; return Object.assign({}, x, { qty: x.qty + 1 }); } return x; });
  if (!hit) st.cart = st.cart.concat([{ menuId: m.id, name: m.name, price: m.price, taxRate: m.taxRate, qty: 1 }]);
  renderRegister();
}
function changeQty(id, delta) {
  st.cart = st.cart.map(function (x) { return String(x.menuId) === String(id) ? Object.assign({}, x, { qty: x.qty + delta }) : x; }).filter(function (x) { return x.qty > 0; });
  if (!st.cart.length) closeSheet();
  renderRegister();
}

/* ---------- 画面: 会計 ---------- */
function renderRegister() {
  var cs = cats();
  if (cs.indexOf(st.cat) < 0) st.cat = "すべて";
  $(".cats").innerHTML = cs.map(function (c) { return '<button class="chip' + (c === st.cat ? " on" : "") + '" data-act="cat" data-v="' + esc(c) + '">' + esc(c) + "</button>"; }).join("");
  var info = $(".info"); info.hidden = cs.length > 0;
  if (!cs.length) { var d = todayTotals(); info.innerHTML = '<span>今日<b class="n">' + d.c + '</b>件<b class="n">' + yen(d.t) + '</b></span><span>次 No.<b class="n">' + pad5(config.receiptCounter) + "</b></span>"; }
  $(".search.narrow .clr").hidden = !st.q;
  renderGrid(); renderBar(); renderPane();
}
function todayTotals() {
  var k = dayKey(new Date().toISOString()), c = 0, t = 0;
  sales.forEach(function (x) { if (!x.voided && dayKey(x.date) === k) { c++; t += Number(x.total) || 0; } });
  return { c: c, t: t };
}
function renderGrid() {
  var q = kana(st.q.trim()), g = $(".grid");
  var list = config.menus.filter(function (m) {
    if (q) return kana(m.name).indexOf(q) >= 0;
    return st.cat === "すべて" || (String(m.cat || "").trim() || "その他") === st.cat;
  });
  if (!config.menus.length) { g.innerHTML = '<div class="blank">まだメニューがありません。<br><button data-act="tab" data-v="settings">設定でメニューを登録する</button></div>'; return; }
  if (!list.length) { g.innerHTML = '<div class="blank">「' + esc(st.q.trim()) + "」に当たるメニューがありません。</div>"; return; }
  g.innerHTML = list.map(function (m) {
    var n = qtyOf(m.id);
    return '<div class="tile' + (n ? " on" : "") + '" data-act="add" data-v="' + esc(m.id) + '" role="button" tabindex="0"><span class="nm">' + seg(m.name) + (m.taxRate === 10 ? "" : "<small>非課税</small>") + '</span><span class="q n">' + n + '</span>' +
      '<button class="minus" data-act="dec" data-v="' + esc(m.id) + '" aria-label="' + esc(m.name) + "を1つ減らす\"" + (n ? "" : ' tabindex="-1"') + ">−</button>" +
      '<span class="pr n">' + yen(m.price) + "</span></div>";
  }).join("");
}
function renderBar() {
  var t = totals(st.cart);
  $(".sum .cnt").innerHTML = t.count ? '<b class="n">' + t.count + "</b>点<i>内訳" + I.chev + "</i>" : "メニューを押して追加";
  $(".sum .tot").textContent = yen(t.total);

    "<h2>" + (m ? "メニューを直す" : "メニューを追加") + "</h2>" +
    '<label class="fld"><span>名前</span><input id="m-name" value="' + esc(m ? m.name : "") + '" autocomplete="off" enterkeyhint="next"></label>' +
    '<label class="fld"><span>税込の金額（円）</span><input id="m-price" inputmode="numeric" value="' + (m ? esc(m.price) : "") + '" autocomplete="off" enterkeyhint="next"></label>' +
    '<label class="fld"><span>分類（空でもかまいません）</span><input id="m-cat" value="' + esc(m && m.cat ? m.cat : "") + '" autocomplete="off" placeholder="例: ワクチン" enterkeyhint="done"></label>' +
    (cl.length ? '<div class="catpick">' + cl.map(function (c) { return '<button type="button" class="chip sm" data-pick="' + esc(c) + '">' + esc(c) + "</button>"; }).join("") + "</div>" : "") +
    '<div class="seg2" role="group" aria-label="税の区分"><button type="button" data-tax="10">課税 10%</button><button type="button" data-tax="0">非課税</button></div>' +
    '<p class="err" id="m-err" hidden></p>' +
    '<div class="dacts">' + (m ? '<button class="btn dngtext" id="m-del">削除</button>' : "") + '<button class="btn" data-dlg="cancel">やめる</button><button class="btn pri" id="m-save">保存する</button></div>',
    function (d) {
      var paint = function () { $$("[data-tax]", d).forEach(function (b) { b.classList.toggle("on", Number(b.dataset.tax) === tax); }); };
      paint();
      d.addEventListener("click", function (e) {
        var t = e.target.closest("[data-tax]"); if (t) { tax = Number(t.dataset.tax); paint(); return; }
        var p = e.target.closest("[data-pick]"); if (p) { $("#m-cat", d).value = p.dataset.pick; return; }
      });
      $("#m-price", d).addEventListener("input", function (e) { e.target.value = e.target.value.replace(/[^0-9]/g, ""); });
      d.addEventListener("input", function () { $("#m-err", d).hidden = true; });
      $("#m-save", d).addEventListener("click", function () {
        var name = $("#m-name", d).value.trim(), price = parseInt($("#m-price", d).value, 10), cat = $("#m-cat", d).value.trim(), err = $("#m-err", d);
        if (!name) { err.textContent = "名前を入れてください。"; err.hidden = false; return; }
        if (!(price > 0)) { err.textContent = "金額を数字で入れてください。"; err.hidden = false; return; }
        if (cat === "すべて") { err.textContent = "「すべて」は分類の名前に使えません。"; err.hidden = false; return; }
        var ms = config.menus.slice(), item = Object.assign({}, m || { id: "m" + Date.now() }, { name: name, price: price, taxRate: tax });
        if (cat) item.cat = cat; else delete item.cat;
        if (m) ms[i] = item; else ms.push(item);
        if (persistConfig(Object.assign({}, config, { menus: ms }))) { closeDlg("ok"); renderMenus(); renderRegister(); toast(m ? "直しました" : "追加しました"); }
      });
      var del = $("#m-del", d);
      if (del) del.addEventListener("click", function () {
        if (!armed) { armed = true; del.textContent = "もう一度押すと削除"; return; }
        var ms = config.menus.filter(function (x) { return x.id !== m.id; });
        if (persistConfig(Object.assign({}, config, { menus: ms }))) { closeDlg("ok"); renderMenus(); renderRegister(); toast("削除しました（これまでの売上はそのままです）"); }
      });
    }
  );
}
function onLogo(e) {
  var f = e.target.files && e.target.files[0]; e.target.value = "";
  if (!f) return;
  var reader = new FileReader();
  reader.onload = function () {
    var img = new Image();
    img.onload = function () {
      var canvas = document.createElement("canvas"), scale = Math.min(1, 240 / img.width);
      canvas.width = Math.max(1, Math.round(img.width * scale)); canvas.height = Math.max(1, Math.round(img.height * scale));
      canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
      if (persistConfig(Object.assign({}, config, { logo: canvas.toDataURL("image/png") }))) renderLogo();
    };
    img.onerror = function () { notice("この画像は読めませんでした", "別の画像（PNG や JPEG）を選んでください。"); };
    img.src = reader.result;
  };
  reader.readAsDataURL(f);
}

/* ---------- バックアップ ---------- */
function exportBackup() {
  var d = new Date(), name = "自費会計バックアップ_" + d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()) + ".json";
  var data = { app: "jihi", version: 2, exportedAt: d.toISOString(), config: config, sales: sales };
  saveFile(new Blob([JSON.stringify(data)], { type: "application/json" }), name, "application/json");
}
function onBackupFile(e) {
  var f = e.target.files && e.target.files[0]; e.target.value = "";
  if (!f) return;
  var reader = new FileReader();
  reader.onload = function () {
    var b = null;
    try { b = JSON.parse(String(reader.result).replace(/^﻿/, "")); } catch (err) {}
    if (!b || typeof b !== "object" || (!Array.isArray(b.sales) && !(b.config && typeof b.config === "object"))) { notice("このファイルは読み込めません", "自費会計の「書き出す」で作ったファイルを選んでください。"); return; }
    var plan = mergePlan(b);
    ask({ title: "バックアップを読み込みますか", body: "売上 " + plan.addSales.length + " 件、メニュー " + plan.addMenus + " 件を、このスマホに足します。すでに入っている会計は二重になりません。いまある売上は消えません。" +
      (plan.sameNo ? "領収書番号が同じ会計が " + plan.sameNo + " 件あります（別々の会計として、両方とも残します）。" : ""), ok: "読み込む" }).then(function (yes) {
      if (!yes) return;
      if (!persistConfig(plan.config)) return;                 /* 先に設定（メニュー・番号）、次に売上 */
      if (!persistSales(plan.sales)) { if (!loadTrouble.length) notice("売上を読み込めませんでした", "メニューと設定だけが反映されています。端末の空きを確かめて、もう一度読み込んでください。"); fillSettings(); return; }
      fillSettings(); render();
      toast("読み込みました");
    });
  };
  reader.onerror = function () { notice("このファイルは読み込めません", "もう一度選び直してください。"); };
  reader.readAsText(f);
}
/* 読み込むファイルの中身は、形を確かめ、数は数に・文字は文字にそろえてから使う（形のおかしいものは足さない） */
function toInt(v) { var n = Math.round(Number(v)); return isFinite(n) ? n : NaN; }
function cleanItem(it) {
  if (!it || typeof it !== "object") return null;
  var price = toInt(it.price), qty = toInt(it.qty);
  if (!(price >= 0) || !(qty > 0)) return null;
  return { menuId: it.menuId == null ? "" : String(it.menuId), name: String(it.name == null ? "" : it.name), price: price, taxRate: Number(it.taxRate) === 10 ? 10 : 0, qty: qty };
}
function cleanSale(x) {
  if (!x || typeof x !== "object" || x.id == null) return null;
  var d = new Date(x.date); if (!x.date || isNaN(d)) return null;
  var items = (Array.isArray(x.items) ? x.items : []).map(cleanItem).filter(Boolean);
  if (!items.length) return null;
  var t = totals(items), no = toInt(x.receiptNo);
  return { id: String(x.id), receiptNo: no > 0 ? no : 0, date: d.toISOString(), patient: String(x.patient || ""), memo: String(x.memo || ""), karteId: String(x.karteId || ""), proviso: String(x.proviso || DEFAULT_PROVISO),
    items: items, total: t.total, taxable: t.taxable, exempt: t.exempt, taxIncluded: t.taxIncluded, showItems: !!x.showItems, voided: !!x.voided };
}
function cleanMenu(m) {
  if (!m || typeof m !== "object" || m.id == null) return null;
  var name = String(m.name == null ? "" : m.name).trim(), price = toInt(m.price);
  if (!name || !(price > 0)) return null;
  var o = { id: String(m.id), name: name, price: price, taxRate: Number(m.taxRate) === 10 ? 10 : 0 }, c = String(m.cat == null ? "" : m.cat).trim();
  if (c && c !== "すべて") o.cat = c;
  return o;
}
function uniqById(list) { var seen = Object.create(null); return list.filter(function (x) { if (seen[x.id]) return false; seen[x.id] = 1; return true; }); }
function mergePlan(b) {
  var have = Object.create(null), haveNo = Object.create(null);
  sales.forEach(function (s) { have[String(s.id)] = 1; haveNo[parseInt(s.receiptNo, 10)] = 1; });
  var inSales = uniqById((Array.isArray(b.sales) ? b.sales : []).map(cleanSale).filter(Boolean));
  var addSales = inSales.filter(function (s) { return !have[s.id]; });
  var sameNo = addSales.filter(function (s) { return s.receiptNo > 0 && haveNo[s.receiptNo]; }).length;
  var nextSales = sales.concat(addSales).sort(function (a, c) { return new Date(c.date) - new Date(a.date); });
  var ic = (b.config && typeof b.config === "object") ? b.config : {}, next = Object.assign({}, config);
  ["clinicName", "address", "tel", "invoiceNo"].forEach(function (k) { if (config[k] === DEFAULT_CONFIG[k] && typeof ic[k] === "string" && ic[k]) next[k] = ic[k]; });
  if (!config.logo && typeof ic.logo === "string" && ic.logo.indexOf("data:image/") === 0) next.logo = ic.logo;
  var theirs = uniqById((Array.isArray(ic.menus) ? ic.menus : []).map(cleanMenu).filter(Boolean));
  var untouched = JSON.stringify(config.menus) === JSON.stringify(DEFAULT_CONFIG.menus), addMenus = 0;
  if (untouched && theirs.length) { next.menus = theirs; addMenus = theirs.length; }
  else { var ids = Object.create(null); config.menus.forEach(function (m) { ids[String(m.id)] = 1; }); var extra = theirs.filter(function (m) { return !ids[m.id]; }); next.menus = config.menus.concat(extra); addMenus = extra.length; }
  var theirNo = toInt(ic.receiptCounter);
  next.receiptCounter = Math.max(parseInt(config.receiptCounter, 10) || 1, (theirNo > 0 && theirNo < 100000000) ? theirNo : 1, addSales.length ? maxReceiptNo(nextSales) + 1 : 1);
  return { sales: nextSales, config: next, addSales: addSales, addMenus: addMenus, sameNo: sameNo };
}

/* ---------- 小窓・お知らせ ---------- */
var dlgResolve = null;
function openDlg(html, onOpen) {
  if (dlgResolve) { var r0 = dlgResolve; dlgResolve = null; r0(undefined); }
  var d = $(".dlg"), fresh = d.cloneNode(false);        /* 前の小窓の仕掛けを残さない */
  d.parentNode.replaceChild(fresh, d);
  fresh.innerHTML = html; $(".dlgwrap").classList.remove("kb"); $(".dlgwrap").hidden = false; $(".dlgwrap").scrollTop = 0;
  if (onOpen) onOpen(fresh);
  return new Promise(function (res) { dlgResolve = res; });
}
function closeDlg(val) { $(".dlgwrap").hidden = true; $(".dlgwrap").classList.remove("kb"); $(".dlg").innerHTML = ""; var r = dlgResolve; dlgResolve = null; if (r) r(val); }
function ask(o) {
  return openDlg("<h2>" + esc(o.title) + "</h2>" + (o.body ? "<p>" + esc(o.body) + "</p>" : "") +
    '<div class="dacts"><button class="btn" data-dlg="cancel">' + esc(o.cancel || "やめる") + '</button><button class="btn ' + (o.danger ? "dng" : "pri") + '" data-dlg="ok">' + esc(o.ok) + "</button></div>").then(function (v) { return v === "ok"; });
}
function notice(title, body) {
  return openDlg("<h2>" + esc(title) + "</h2>" + (body ? "<p>" + esc(body) + "</p>" : "") + '<div class="dacts"><span class="sp"></span><button class="btn pri" data-dlg="ok" style="flex:none">わかりました</button></div>');
}
var toastT = null;
function toast(msg) { var t = $(".toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(function () { t.classList.remove("show"); }, 2200); }

/* ---------- 全体の描き直し ---------- */
function render() {
  $$(".view").forEach(function (v) { v.hidden = v.dataset.view !== st.view; });
  $$(".tab").forEach(function (b) { var on = b.dataset.v === st.view; b.classList.toggle("on", on); if (on) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
  if (st.view === "register") renderRegister();
  else if (st.view === "history") renderHistory();
  else if (st.view === "monthly") renderMonthly();
  else if (st.view === "settings") fillSettings();
}

/* ---------- 押したとき ---------- */
var act = {
  tab: function (v) { st.view = v; closeSheet(); if (v === "history") st.histLimit = HIST_PAGE; render(); },
  cat: function (v) { st.cat = v; renderRegister(); },
  add: function (v) { addToCart(v); },
  inc: function (v) { changeQty(v, 1); },
  dec: function (v) { changeQty(v, -1); },
  "open-sheet": function () { if (st.cart.length) openSheet(); },
  "close-sheet": function () { closeSheet(); },
  "toggle-opt": function () { st.optOpen = !st.optOpen; renderOpt(); },
  "toggle-print-items": function () { st.printItems = !st.printItems; renderOpt(); },
  issue: function () { issue(); },
  "clear-q": function () { setBound("q", ""); renderRegister(); },
  "toggle-pill": function () { var u = loadUI(); u.pill = pillOn() ? "off" : "on"; saveUI(u); applyPill(); $(".pillsw").setAttribute("aria-checked", pillOn() ? "true" : "false"); },
  reprint: function (v) { var s = findSale(v); if (s) receiptDialog(s, false); },
  "void": function (v) { toggleVoid(v); },
  more: function () { st.histLimit += HIST_PAGE; renderHistory(); },
  month: function (v) { st.selMonth = v; renderMonthly(); },
  csv: function () { exportCSV(); },
  "menu-new": function () { menuDialog(null); },
  "menu-edit": function (v) { menuDialog(v); },
  "menu-up": function (v) { moveMenu(v, -1); },
  "menu-down": function (v) { moveMenu(v, 1); },
  "logo-del": function () { if (persistConfig(Object.assign({}, config, { logo: null }))) renderLogo(); },
  "backup-export": function () { exportBackup(); }
};
document.addEventListener("click", function (e) {
  var dl = e.target.closest("[data-dlg]");
  if (dl) { closeDlg(dl.dataset.dlg); return; }
  if (e.target.classList && e.target.classList.contains("dlgwrap")) { closeDlg("cancel"); return; }
  var el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  var f = act[el.dataset.act];
  if (f) f(el.dataset.v, el, e);
});
document.addEventListener("keydown", function (e) {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches('[role="button"][data-act]')) { e.preventDefault(); e.target.click(); return; }
  if (e.key === "Enter" && e.target.tagName === "INPUT" && e.target.type !== "file") {
    /* 小窓の中では次の欄へ進み、最後の欄ではキーボードを閉じる */
    var box = e.target.closest(".dlg"), next = null;
    if (box) { var ins = $$("input", box).filter(function (x) { return x.type !== "file"; }); next = ins[ins.indexOf(e.target) + 1] || null; }
    e.preventDefault();
    if (next) next.focus(); else e.target.blur();
    return;
  }
  if (e.key === "Escape") { if (!$(".dlgwrap").hidden) closeDlg("cancel"); else closeSheet(); }
});
document.addEventListener("input", function (e) {
  var el = e.target;
  if (el.dataset && el.dataset.bind) {
    var k = el.dataset.bind; setBound(k, el.value, el);
    if (k === "q") { $(".search.narrow .clr").hidden = !st.q; renderGrid(); }
    else if (k === "histQ") { st.histLimit = HIST_PAGE; renderHistory(); }
    else if (k === "proviso" || k === "memo") renderOpt();
    return;
  }
  if (el.dataset && el.dataset.cfg) {
    var key = el.dataset.cfg;
    if (key === "receiptCounter") return;                 /* 番号は打ち終えてから（下の change で）保存する */
    var next = Object.assign({}, config); next[key] = el.value;
    persistConfig(next);
  }
});
function onCounterChange(el) {
  var n = parseInt(String(el.value).replace(/[^0-9]/g, ""), 10), mx = maxReceiptNo();
  if (!(n > 0)) { el.value = config.receiptCounter; return; }
  var apply = function () { persistConfig(Object.assign({}, config, { receiptCounter: n })); el.value = config.receiptCounter; };
  if (n === config.receiptCounter) { el.value = n; return; }
  if (n > mx) { apply(); return; }
  ask({ title: "この番号は、もう使っています", body: "No." + pad5(mx) + " まで発行ずみです。" + pad5(n) + " からにすると、同じ番号の領収書ができます。", ok: "この番号にする", danger: true }).then(function (yes) {
    if (yes) apply(); else el.value = config.receiptCounter;
  });
}
document.addEventListener("change", function (e) {
  if (e.target.id === "logofile") onLogo(e);
  else if (e.target.id === "bkfile") onBackupFile(e);
  else if (e.target.dataset && e.target.dataset.cfg === "receiptCounter") onCounterChange(e.target);
});
/* 番号の欄は、入力を終えたら整えて見せる */
document.addEventListener("focusout", function (e) {
  if (e.target.dataset && e.target.dataset.cfg === "receiptCounter" && $(".dlgwrap").hidden) e.target.value = config.receiptCounter;
  if (e.target.closest && e.target.closest(".pane")) setTimeout(function () { var a = document.activeElement; if (!(a && a.closest && a.closest(".pane") && a.tagName === "INPUT")) $(".pane").classList.remove("kb"); }, 60);
  if (e.target.closest && e.target.closest(".dlg")) setTimeout(function () { var a = document.activeElement; if (!(a && a.closest && a.closest(".dlg") && a.tagName === "INPUT")) $(".dlgwrap").classList.remove("kb"); }, 60);
});
/* せまい画面では、下から出るお会計の中で文字を打つとキーボードに隠れる。打っている間だけ上に寄せる */
document.addEventListener("focusin", function (e) {
  if (!isWide() && e.target.tagName === "INPUT" && e.target.type !== "file" && e.target.closest && e.target.closest(".dlg")) { $(".dlgwrap").classList.add("kb"); $(".dlgwrap").scrollTop = 0; }
  if (!isWide() && e.target.tagName === "INPUT" && e.target.closest && e.target.closest(".pane")) {
    $(".pane").classList.add("kb");
    var el = e.target; setTimeout(function () { try { el.scrollIntoView({ block: "center" }); } catch (err) {} }, 80);
  }
});

/* ---------- はじまり ---------- */
function start() {
  load();
  $(".tabs").innerHTML = [["register", "pay", "会計"], ["history", "hist", "履歴"], ["monthly", "month", "月次"], ["settings", "conf", "設定"]].map(function (t) {
    return '<button class="tab" data-act="tab" data-v="' + t[0] + '">' + I[t[1]] + "<span>" + t[2] + "</span></button>";
  }).join("");
  $$(".search").forEach(function (l) { l.insertAdjacentHTML("afterbegin", I.search); });
  $(".search .clr").innerHTML = I.x;
  applyPill();
  window.addEventListener("resize", applyPill);
  setBound("proviso", DEFAULT_PROVISO);
  render();
  if (loadTrouble.length) notice(STOP_TITLE, STOP_BODY);
  var warm = function () { loadVendor().catch(function () {}); };
  if (window.requestIdleCallback) window.requestIdleCallback(warm, { timeout: 4000 }); else setTimeout(warm, 1500);
}
start();
